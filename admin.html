<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart Admin | Pro Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2874f0; --secondary: #fb641b; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 5px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-upload { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .multi-row { display: flex; gap: 10px; }
        .multi-row > div { flex: 1; }
        .size-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> Add Product (Advanced)</h2>
        
        <label>Product Name</label>
        <input type="text" id="name" placeholder="Ex: Cotton Slim Fit T-Shirt">

        <div class="multi-row">
            <div>
                <label>Price (₹)</label>
                <input type="number" id="price" placeholder="499">
            </div>
            <div>
                <label>Category</label>
                <select id="cat">
                    <option value="Men">Men Wear</option>
                    <option value="Women">Women Wear</option>
                    <option value="Electronics">Electronics</option>
                </select>
            </div>
        </div>

        <!-- Size & Color -->
        <div class="multi-row">
            <div>
                <label>Available Sizes (Comma se alag karein)</label>
                <input type="text" id="sizes" placeholder="S, M, L, XL">
            </div>
            <div>
                <label>Colours (Comma se alag karein)</label>
                <input type="text" id="colors" placeholder="Red, Black, Blue">
            </div>
        </div>

        <!-- 3 Photo Links -->
        <label>Photo 1 (Main Image)</label>
        <input type="text" id="img1" placeholder="Direct Link 1">
        
        <label>Photo 2 (Optional)</label>
        <input type="text" id="img2" placeholder="Direct Link 2">
        
        <label>Photo 3 (Optional)</label>
        <input type="text" id="img3" placeholder="Direct Link 3">

        <button class="btn-upload" onclick="uploadProduct()">Website Par Live Karein</button>
        <p id="upStatus" style="text-align:center; display:none; font-weight:bold;"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      messagingSenderId: "894407834952",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.uploadProduct = async function() {
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        const c = document.getElementById('cat').value;
        const s = document.getElementById('sizes').value;
        const clr = document.getElementById('colors').value;
        const i1 = document.getElementById('img1').value;
        const i2 = document.getElementById('img2').value;
        const i3 = document.getElementById('img3').value;
        const status = document.getElementById('upStatus');

        if(!n || !p || !i1) { alert("Kam se kam Name, Price aur Pehli Photo zaruri hai!"); return; }

        status.style.display = "block";
        status.innerHTML = "⏳ Uploading...";

        // Photos ko array mein daalna
        const imageList = [i1];
        if(i2) imageList.push(i2);
        if(i3) imageList.push(i3);

        try {
            await addDoc(collection(db, "products"), {
                name: n,
                price: p,
                category: c,
                sizes: s.split(',').map(item => item.trim()), // "S, M" ko ["S", "M"] bana dega
                colors: clr.split(',').map(item => item.trim()),
                images: imageList,
                time: new Date()
            });
            status.innerHTML = "✅ Live Successfully!";
            setTimeout(() => location.reload(), 1500);
        } catch(e) { alert("Error: " + e.message); }
    }
</script>
</body>
</html>
