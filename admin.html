<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart Admin | Professional Dashboard</title>
    <style>
        :root { --primary: #2874f0; --secondary: #fb641b; --success: #388e3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .admin-card { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; font-weight: 800; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
        
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 8px rgba(40, 116, 240, 0.2); }
        
        .photo-section { background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px dashed #ccc; margin-top: 20px; }
        .photo-section h4 { margin: 0 0 10px 0; font-size: 14px; color: var(--primary); }
        
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        button:hover { background: #1a5abd; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        button:active { transform: scale(0.98); }

        #status { text-align: center; margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 5px; display: none; }
        .loading { color: #1565c0; background: #e3f2fd; display: block !important; }
        .success { color: #2e7d32; background: #e8f5e9; display: block !important; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Dkart Admin Panel</h2>
    
    <div class="form-group">
        <label>Admin Security Key</label>
        <input type="password" id="adminPass" placeholder="Amit@123">
    </div>

    <div class="form-group">
        <label>Product Full Name</label>
        <input type="text" id="name" placeholder="Ex: Men Slim Fit Cotton Shirt">
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
            <label>Price (₹)</label>
            <input type="number" id="price" placeholder="499">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Category</label>
            <select id="cat">
                <option value="men">Men's Fashion</option>
                <option value="women">Women's Fashion</option>
                <option value="gadgets">Gadgets & Tech</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Available Sizes</label>
        <input type="text" id="sizes" placeholder="S, M, L, XL, XXL">
    </div>

    <div class="form-group">
        <label>Available Colours</label>
        <input type="text" id="colours" placeholder="Red, Blue, Green, White">
    </div>

    <div class="photo-section">
        <h4>🖼️ Product Photos (Max 5)</h4>
        <input type="text" id="img1" placeholder="Main Image Link (Direct Link)" style="margin-bottom: 8px;">
        <input type="text" id="img2" placeholder="Second Image Link" style="margin-bottom: 8px;">
        <input type="text" id="img3" placeholder="Third Image Link" style="margin-bottom: 8px;">
        <input type="text" id="img4" placeholder="Fourth Image Link" style="margin-bottom: 8px;">
        <input type="text" id="img5" placeholder="Fifth Image Link">
        <small style="display:block; margin-top:5px; color:#777;">Postimages se "Direct Link" copy karke yahan daalein.</small>
    </div>

    <button onclick="uploadNow()">⚡ PUSH TO WEBSITE</button>
    
    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      messagingSenderId: "894407834952",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.uploadNow = async function() {
        const pass = document.getElementById('adminPass').value;
        const st = document.getElementById('status');

        if(pass !== "Amit@123") { 
            alert("❌ Galat Security Key!"); 
            return; 
        }

        const imgList = [
            document.getElementById('img1').value,
            document.getElementById('img2').value,
            document.getElementById('img3').value,
            document.getElementById('img4').value,
            document.getElementById('img5').value
        ].filter(url => url.trim() !== "");

        if(imgList.length === 0) {
            alert("⚠️ Kam se kam ek photo link zaroori hai!");
            return;
        }

        st.className = "loading";
        st.innerText = "⏳ Connecting to Firebase & Uploading...";

        try {
            await addDoc(collection(db, "products"), {
                name: document.getElementById('name').value,
                price: document.getElementById('price').value,
                category: document.getElementById('cat').value,
                size: document.getElementById('sizes').value,
                colour: document.getElementById('colours').value,
                images: imgList,
                time: new Date()
            });
            
            st.className = "success";
            st.innerText = "✅ Saman Successfully Live Ho Gaya!";
            
            setTimeout(() => { location.reload(); }, 2000);
        } catch (e) {
            st.style.display = "block";
            st.style.color = "red";
            st.innerText = "❌ Error: " + e.message;
        }
    }
</script>
</body>
</html>
