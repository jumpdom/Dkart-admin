<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart Admin Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2874f0; --secondary: #fb641b; --danger: #d9534f; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        
        /* Tabs Styling */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #ddd; }
        .tab-btn.active { background: var(--primary); color: white; }

        .section { display: none; }
        .section.active { display: block; }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-top: 10px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px; box-sizing: border-box; }
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        /* Order Styling */
        .order-card { border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 15px; position: relative; background: #fff; }
        .del-btn { position: absolute; top: 15px; right: 15px; background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('add-product')">Add Product</button>
        <button class="tab-btn" onclick="showTab('view-orders')">Orders Management</button>
    </div>

    <!-- Section 1: Add Product -->
    <div id="add-product" class="section active">
        <div class="card">
            <h2><i class="fas fa-plus"></i> Naya Saman Add Karein</h2>
            <label>Product Name</label>
            <input type="text" id="pName" placeholder="Ex: Cotton Shirt">
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Price (₹)</label>
                    <input type="number" id="pPrice" placeholder="599">
                </div>
                <div style="flex:1;">
                    <label>Category</label>
                    <select id="pCat">
                        <option value="Men">Men</option>
                        <option value="Women">Women</option>
                        <option value="Gadgets">Gadgets</option>
                    </select>
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Sizes (S, M, L...)</label>
                    <input type="text" id="pSizes" placeholder="M, L, XL">
                </div>
                <div style="flex:1;">
                    <label>Colours</label>
                    <input type="text" id="pColors" placeholder="Black, White">
                </div>
            </div>

            <label>Photo 1 (Main)</label>
            <input type="text" id="img1" placeholder="Direct Link 1">
            <label>Photo 2</label>
            <input type="text" id="img2" placeholder="Direct Link 2">
            <label>Photo 3</label>
            <input type="text" id="img3" placeholder="Direct Link 3">

            <button class="btn-main" onclick="uploadProduct()">Website Par Live Karein</button>
        </div>
    </div>

    <!-- Section 2: View Orders -->
    <div id="view-orders" class="section">
        <div class="card">
            <h2><i class="fas fa-shopping-bag"></i> Customer Orders</h2>
            <div id="ordersList">Loading...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      messagingSenderId: "894407834952",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Tab Switching
    window.showTab = function(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'view-orders') loadOrders();
    }

    // 1. Upload Product
    window.uploadProduct = async function() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const images = [document.getElementById('img1').value];
        if(document.getElementById('img2').value) images.push(document.getElementById('img2').value);
        if(document.getElementById('img3').value) images.push(document.getElementById('img3').value);

        try {
            await addDoc(collection(db, "products"), {
                name, price, images,
                category: document.getElementById('pCat').value,
                sizes: document.getElementById('pSizes').value.split(','),
                colors: document.getElementById('pColors').value.split(','),
                time: new Date()
            });
            alert("Product Added!");
            location.reload();
        } catch(e) { alert(e.message); }
    }

    // 2. Load & Save Orders
    async function loadOrders() {
        const list = document.getElementById('ordersList');
        const q = query(collection(db, "orders"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        list.innerHTML = snap.empty ? "No orders yet." : "";

        snap.forEach(res => {
            const ord = res.data();
            list.innerHTML += `
                <div class="order-card">
                    <button class="del-btn" onclick="deleteOrder('${res.id}')">Delete</button>
                    <strong>${ord.customerName}</strong> (${ord.customerPhone})<br>
                    <small>${ord.time.toDate().toLocaleString()}</small><br>
                    <p><b>Product:</b> ${ord.productName} - ₹${ord.price}</p>
                    <p><b>Address:</b> ${ord.address}</p>
                </div>`;
        });
    }

    // 3. Delete Order (Only when you click)
    window.deleteOrder = async function(id) {
        if(confirm("Kya aap ye order delete karna chahte hain?")) {
            await deleteDoc(doc(db, "orders", id));
            loadOrders();
        }
    }
</script>
</body>
</html>
