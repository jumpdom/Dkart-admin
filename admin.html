<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart Admin | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2874f0; --secondary: #fb641b; --success: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
        
        /* Form Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-upload { background: var(--primary); color: white; margin-top: 10px; }
        .btn-upload:hover { background: #1e5cc3; }

        /* Order Box Styling */
        .order-box { border: 1px solid #ddd; padding: 15px; border-radius: 10px; margin-bottom: 15px; background: #fff; border-left: 5px solid var(--secondary); }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .status-badge { background: #fff3cd; color: #856404; padding: 4px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .customer-info { font-size: 14px; color: #333; line-height: 1.6; }
        .product-info { background: #f8f9fa; padding: 8px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> Naya Saman Add Karein</h2>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="name" placeholder="Ex: Men T-shirt">
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Price (₹)</label>
                <input type="number" id="price" placeholder="299">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Category</label>
                <select id="cat">
                    <option value="Men">Men</option>
                    <option value="Women">Women</option>
                    <option value="Gadgets">Gadgets</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Photo Link (Direct Link)</label>
            <input type="text" id="img1" placeholder="Postimg ka direct link paste karein">
        </div>
        <button class="btn-upload" onclick="uploadProduct()">Website Par Live Karein</button>
        <p id="upStatus" style="text-align:center; display:none;"></p>
    </div>

    <div class="card">
        <h2><i class="fas fa-shopping-cart"></i> Recent Orders</h2>
        <div id="ordersList">Orders load ho rahe hain...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      messagingSenderId: "894407834952",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- Saman Upload Karne Ka Function ---
    window.uploadProduct = async function() {
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        const c = document.getElementById('cat').value;
        const img = document.getElementById('img1').value;
        const status = document.getElementById('upStatus');

        if(!n || !p || !img) { alert("Sari jankari bhariye!"); return; }

        status.style.display = "block";
        status.innerHTML = "⏳ Upload ho raha hai...";

        try {
            await addDoc(collection(db, "products"), {
                name: n,
                price: p,
                category: c,
                images: [img], // Naye array format mein
                time: new Date()
            });
            status.innerHTML = "✅ Saman website par live ho gaya!";
            setTimeout(() => location.reload(), 2000);
        } catch(e) { alert("Error: " + e.message); }
    }

    // --- Orders Load Karne Ka Function ---
    async function fetchOrders() {
        const oList = document.getElementById('ordersList');
        try {
            const q = query(collection(db, "orders"), orderBy("time", "desc"));
            const snap = await getDocs(q);
            
            if(snap.empty) {
                oList.innerHTML = "<p style='text-align:center; color:gray;'>Abhi koi naya order nahi hai.</p>";
                return;
            }

            oList.innerHTML = "";
            snap.forEach(doc => {
                const ord = doc.data();
                const date = ord.time ? ord.time.toDate().toLocaleString() : "N/A";
                
                oList.innerHTML += `
                    <div class="order-box">
                        <div class="order-header">
                            <strong>Order Date: ${date}</strong>
                            <span class="status-badge">Naya Order</span>
                        </div>
                        <div class="customer-info">
                            <i class="fas fa-user"></i> <b>Naam:</b> ${ord.customerName}<br>
                            <i class="fas fa-phone"></i> <b>Mobile:</b> ${ord.customerPhone}<br>
                            <i class="fas fa-map-marker-alt"></i> <b>Address:</b> ${ord.address}
                        </div>
                        <div class="product-info">
                            📦 ${ord.productName} - ₹${ord.price} (COD)
                        </div>
                    </div>`;
            });
        } catch(e) {
            oList.innerHTML = "<p style='color:red;'>Error loading orders: " + e.message + "</p>";
        }
    }

    fetchOrders();
</script>
</body>
</html>
