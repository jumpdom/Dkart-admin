<div class="admin-card" style="max-width: 800px; margin-top: 20px;">
    <h2>📥 New Orders</h2>
    <div id="ordersList">Loading orders...</div>
</div>

<script type="module">
    // ... (Firebase initialization) ...
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    async function loadOrders() {
        const oList = document.getElementById('ordersList');
        const q = query(collection(db, "orders"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        oList.innerHTML = "";

        snap.forEach(doc => {
            const ord = doc.data();
            oList.innerHTML += `
                <div style="border:1px solid #ddd; padding:10px; margin-bottom:10px; border-radius:8px; background:#fefefe;">
                    <p><strong>Customer:</strong> ${ord.customerName} (${ord.customerPhone})</p>
                    <p><strong>Item:</strong> ${ord.productName} - ₹${ord.price}</p>
                    <p><strong>Address:</strong> ${ord.address}</p>
                    <p><span style="background:orange; color:white; padding:2px 8px; border-radius:4px; font-size:12px;">${ord.status}</span></p>
                </div>`;
        });
    }
    loadOrders();
</script>
