<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart Admin | Saman Add Karein</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2874f0; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #2874f0; color: white; font-weight: bold; cursor: pointer; border: none; }
        .link-note { font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="box">
    <h2>📦 Saman Add Karein</h2>
    
    <label>Admin Password:</label>
    <input type="password" id="adminPass" placeholder="Password daalein">

    <label>Product Name:</label>
    <input type="text" id="name" placeholder="Jaise: Men Shirt">

    <label>Price (₹):</label>
    <input type="number" id="price" placeholder="Jaise: 499">

    <label>Category:</label>
    <select id="cat">
        <option value="men">Men</option>
        <option value="women">Women</option>
        <option value="gadgets">Gadgets</option>
    </select>

    <label>Saman ki Details:</label>
    <textarea id="desc" placeholder="Size, Colour, etc."></textarea>

    <label>Photo ka Link:</label>
    <input type="text" id="img" placeholder="http://image-link.com">
    <p class="link-note">Note: Photo <a href="https://postimages.org/" target="_blank">Yahan Upload Karein</a> aur "Direct Link" copy karke yahan daalein.</p>

    <button onclick="uploadNow()">Website Par Live Karein</button>
    <p id="status" style="text-align:center; font-weight:bold;"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // Aapka Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      messagingSenderId: "894407834952",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.uploadNow = async function() {
        const pass = document.getElementById('adminPass').value;
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        const c = document.getElementById('cat').value;
        const d = document.getElementById('desc').value;
        const i = document.getElementById('img').value;
        const st = document.getElementById('status');

        if(pass !== "Amit@123") { alert("Galat Password!"); return; }
        if(!n || !p || !i) { alert("Please sab bhariye!"); return; }

        st.innerText = "⏳ Uploading...";
        try {
            await addDoc(collection(db, "products"), {
                name: n, price: p, category: c, desc: d, imgUrl: i, time: new Date()
            });
            st.style.color = "green";
            st.innerText = "✅ Saman Live Ho Gaya!";
            // Form saaf karein
            document.getElementById('name').value = "";
            document.getElementById('price').value = "";
            document.getElementById('img').value = "";
        } catch (e) {
            st.style.color = "red";
            st.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
